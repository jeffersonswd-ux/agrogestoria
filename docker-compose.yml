version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: agrogestor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agrogestor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-agrogestor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-agrogestor} -d ${POSTGRES_DB:-agrogestor}']
      interval: 10s
      timeout: 5s
      retries: 10
    # não exposto publicamente por padrão — liberne com "ports:" apenas em desenvolvimento
    networks: [agrogestor]

  redis:
    image: redis:7-alpine
    container_name: agrogestor_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [agrogestor]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: agrogestor_backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrogestor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agrogestor}?schema=public
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [agrogestor]

  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: agrogestor_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agrogestor}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agrogestor}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [agrogestor]

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: agrogestor_frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_started
    networks: [agrogestor]

volumes:
  postgres_data:
  redis_data:
  uploads_data:

networks:
  agrogestor:
    driver: bridge
